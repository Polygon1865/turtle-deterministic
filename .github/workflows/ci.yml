name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf]"
      - name: Tests (offline, no Tushare token)
        run: python -m pytest -q
      - name: Lint selected correctness rules
        run: python -m ruff check src --select F401,F601,F841
      - name: Type-check deterministic core
        run: |
          python -m mypy \
            src/turtlefw/metrics/cashflow.py \
            src/turtlefw/metrics/valuation_models.py \
            src/turtlefw/metrics/statements.py \
            src/turtlefw/factors/engine.py \
            src/turtlefw/report/analysis.py \
            src/turtlefw/report/pack.py \
            src/turtlefw/report/html.py \
            src/turtlefw/pdf/extract.py \
            src/turtlefw/facts.py \
            src/turtlefw/research.py \
            src/turtlefw/report/snapshot.py \
            src/turtlefw/report/finalize.py \
            src/turtlefw/report/manifest.py \
            src/turtlefw/agent/orchestrator.py \
            src/turtlefw/agent/runner.py \
            src/turtlefw/cleanroom.py \
            src/turtlefw/cleanroom_worker.py \
            src/turtlefw/paths.py \
            src/turtlefw/metrics/registry.py \
            src/turtlefw/pdf/hk_facts.py \
            src/turtlefw/pit.py \
            src/turtlefw/qa.py \
            src/turtlefw/state.py \
            src/turtlefw/agent/research_agent.py \
            src/turtlefw/metrics/source_resolver.py \
            src/turtlefw/numeric_audit.py \
            src/turtlefw/data/sec.py \
            src/turtlefw/data/coverage.py \
            src/turtlefw/data/hkexnews.py \
            src/turtlefw/agent/research_prompt.py \
            src/turtlefw/agent/llm.py
