[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "turtle-framework"
version = "0.1.0"
description = "Deterministic fundamentals pipeline and four-factor analysis for A-share / HK equities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "jinja2>=3.1",
    "tushare>=1.4",
    "requests>=2.32",
]

[project.optional-dependencies]
hk = ["yfinance>=0.2"]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
turtle = "turtlefw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turtlefw = ["report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["turtlefw"]
