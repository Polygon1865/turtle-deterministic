# Daily production defaults for one Windows host.
# Paths are supplied by scripts/run_daily.ps1; keep this file policy-only.

top_n = 20
llm_top_n = 20
fast_limit = 100
deep_limit = 30

# A-share uses the fast/deep screen. HK starts from the whole listed market:
# cheap price/turnover/listing-age filter, then one annual indicator per
# survivor, then a quality/valuation ranking. Set hk_codes explicitly only for
# a manual watchlist override; an empty list means market-wide screen.
markets = ["A", "HK"]
hk_codes = []
hk_limit = 20
hk_candidate_limit = 100
hk_llm_top_n = 20

# Leave rf empty to let the provider decide. Set a decimal string for a fixed
# risk-free rate, e.g. rf = "2.0".
rf = ""
rf_source = ""
research_max_input_tokens = 60000
research_retries = 1

screen_attempts = 3
retry_seconds = 1800
workers = 1
report_workers = 4
resume = true
api_interval = 0.35
stock_timeout_seconds = 1800
screen_timeout_seconds = 1800

refresh_market = true
allow_stale = false
# Publish successful stocks even when another stock failed. Set false to keep
# the previous site whenever any selected stock fails.
publish_partial = true

# 跑完自动生成 daily briefing（.runs/daily/<date>/briefing.md 与 briefing.txt）
briefing = true
briefing_limit = 6
